<div class="container">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Nueva tarea</h2>
    </div>

    <div class="card-body">
      <form name="nuevaTareaForm" role="form" class="stack" (submit)="$event.preventDefault()">
        <div class="field-row">
          <div class="field">
            <label class="label" for="descripcion">Descripción</label>
            <input
              type="text"
              name="descripcion"
              class="input"
              [(ngModel)]="tarea.descripcion"
              data-testid="descripcion"
              autocomplete="off"
              placeholder="Descripción de la tarea" />
            <validation-field [tarea]="tarea" [field]="'descripcion'"></validation-field>
          </div>

          <div class="field">
            <label class="label" for="iteracion">Iteración</label>
            <input
              type="text"
              class="input"
              name="iteracion"
              [(ngModel)]="tarea.iteracion"
              data-testid="iteracion"
              autocomplete="off"
              placeholder="Nombre del release o iteración" />
            <validation-field [tarea]="tarea" [field]="'iteracion'"></validation-field>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="label" for="asignatario">Asignado a</label>
            <select
              data-testid="asignatario"
              name="asignatario"
              class="select"
              [ngModel]="asignatario()" (ngModelChange)="asignatario.set($event)">
              <option [ngValue]="undefined">Sin asignar</option>
              @for (usuario of usuariosPosibles(); track usuario) {
                <option [ngValue]="usuario">{{ usuario.nombre }}</option>
              }
            </select>
          </div>

          <div class="field">
            <label class="label" for="fecha">Fecha</label>
            <input
              type="date"
              autocomplete="off"
              data-testid="fecha"
              name="fecha"
              class="input"
              [(ngModel)]="fecha"
              placeholder="Fecha de inicio de la tarea" />
            <validation-field [tarea]="tarea" [field]="'fecha'"></validation-field>
          </div>

          <div class="field">
            <label class="label" for="cumplimiento">% Cumplimiento</label>
            <input
              type="number"
              class="input"
              name="cumplimiento"
              [(ngModel)]="tarea.porcentajeCumplimiento"
              data-testid="porcentaje-cumplimiento"
              min="0"
              max="100"
              placeholder="0 a 100" />
            <validation-field [tarea]="tarea" [field]="'porcentajeCumplimiento'"></validation-field>
          </div>
        </div>

        @for (error of errors(); track error) {
          <div class="alert alert-danger">{{ error }}</div>
        }
      </form>

      <hr class="divider" />

      <div class="form-actions">
        <button type="button" class="btn btn-primary" data-testid="guardar" (click)="guardar()">
          Guardar
        </button>
        <button type="button" class="btn btn-ghost" data-testid="cerrar" (click)="navegarAHome()">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
